services:
  neo4j:
    image: neo4j:5
    ports:
      # host ports remapped: 7474/7687 are taken by semantica-neo4j
      - "17474:7474"
      - "17687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password123}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-password123}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  openzep:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GRAPH_DB: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password123}
      # Persist batch state (restart reconciliation) in a named volume
      SQLITE_PATH: /data/openzep.db
    volumes:
      - openzep_data:/data
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

volumes:
  neo4j_data:
  openzep_data:
